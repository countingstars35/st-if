<div class="input-feedback-extension-settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <b>인풋 피드백 커스텀</b>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <div class="input-feedback-extension_block flex-container">
        <input id="input-feedback-enabled" type="checkbox" />
        <label for="input-feedback-enabled">활성화</label>
      </div>
      <div class="input-feedback-extension_block flex-container">
        <input id="input-feedback-show-quick" type="checkbox" />
        <label for="input-feedback-show-quick">⚡ 퀵버튼 표시 (입력창 옆)</label>
      </div>
      <div class="input-feedback-extension_block flex-container" style="gap:8px;align-items:center;">
        <label for="input-feedback-quick-side" style="white-space:nowrap;font-size:0.9em;">퀵버튼 위치</label>
        <select id="input-feedback-quick-side" class="text_pole" style="flex:1;padding:4px;">
          <option value="left">왼쪽</option>
          <option value="right">오른쪽</option>
        </select>
      </div>
      <div class="input-feedback-extension_block flex-container">
        <input id="input-feedback-auto-new" type="checkbox" />
        <label for="input-feedback-auto-new">새 메시지 자동 피드백</label>
      </div>
      <div class="input-feedback-extension_block flex-container">
        <input id="input-feedback-auto-edit" type="checkbox" />
        <label for="input-feedback-auto-edit">수정 메시지 자동 피드백</label>
      </div>
      <div class="input-feedback-extension_block flex-container">
        <input id="input-feedback-folded" type="checkbox" />
        <label for="input-feedback-folded">피드백 기본 접기</label>
      </div>
      <div class="input-feedback-extension_block flex-container">
        <div class="justifyspacebetween alignitemscenter input-feedback-setting-title">
          <span class="flex1">템플릿</span>
        </div>
        <textarea id="input-feedback-template" class="text_pole textarea_compact" rows="6" placeholder="AI에게 피드백 요청을 보낼 형식입니다."></textarea>
        <small><code>{{previousMessages}}</code>, <code>{{message}}</code>, <code>{{prompt}}</code> 가 포함되어야 합니다.</small>
      </div>
      <div class="input-feedback-extension_block flex-container">
        <div class="justifyspacebetween alignitemscenter input-feedback-setting-title">
          <span class="flex1">프롬프트</span>
        </div>
        <textarea id="input-feedback-prompt" class="text_pole textarea_compact" rows="6" placeholder="피드백 요청 시 AI에게 보낼 프롬프트입니다."></textarea>
      </div>
      <div class="input-feedback-extension_block flex-container">
        <label for="input-feedback-num-prev-msgs" class="title_restorable input-feedback-setting-title">
          <span>이전 메시지 <span id="input-feedback-num-prev-msgs_value"></span>개를 함께 전송</span>
        </label>
        <input id="input-feedback-num-prev-msgs" type="range" min="0" max="20" step="1" />
      </div>
      <div class="input-feedback-extension_block flex-container" style="flex-direction:column;gap:6px;margin-top:8px;">
        <div class="justifyspacebetween alignitemscenter input-feedback-setting-title">
          <span class="flex1" style="font-weight:bold;">🔌 피드백 API</span>
        </div>
        <small style="opacity:0.7;">ST에 이미 연결된 API를 그대로 사용합니다. API 키 재입력 불필요.</small>
        <select id="input-feedback-provider" class="text_pole" style="width:100%;padding:6px;">
          <option value="st">현재 ST 연결 그대로 사용</option>
          <option value="openai">OpenAI</option>
          <option value="claude">Claude (Anthropic)</option>
          <option value="google">Google Gemini</option>
          <option value="vertexai">Google Vertex AI</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openrouter">OpenRouter</option>
          <option value="cohere">Cohere</option>
          <option value="groq">Groq</option>
          <option value="mistralai">MistralAI</option>
          <option value="xai">xAI (Grok)</option>
        </select>
        <div id="input-feedback-model-section" style="display:none;flex-direction:column;gap:6px;">
          <div style="flex-direction:column;gap:4px;">
            <label style="font-size:0.85em;opacity:0.8;">모델 선택</label>
            <select id="input-feedback-model-select" class="text_pole" style="width:100%;padding:6px;"></select>
          </div>
          <div style="flex-direction:column;gap:4px;">
            <label style="font-size:0.85em;opacity:0.8;">커스텀 모델 (직접 입력 시 우선 적용)</label>
            <input id="input-feedback-custom-model" class="text_pole" type="text" style="width:100%;padding:6px;box-sizing:border-box;" placeholder="모델명 직접 입력 (비우면 위 선택 사용)" />
          </div>
        </div>
      </div>
      <div class="input-feedback-extension_block flex-container" style="flex-direction:column;gap:6px;margin-top:8px;">
        <input id="input-feedback-export" class="menu_button" type="button" value="📋 피드백만 추출하기" />
        <input id="input-feedback-export-chat" class="menu_button" type="button" value="💬 채팅 + 피드백 함께 추출" />
        <input id="input-feedback-export-all" class="menu_button" type="button" value="🌐 채팅 + 번역 + 피드백 추출" />
        <input id="input-feedback-purge" class="menu_button" type="button" value="⚠ 피드백 삭제" style="background-color:#6b0000;color:#ffaaaa;border-color:#ff4444;" />
      </div>
    </div>
  </div>
</div>
